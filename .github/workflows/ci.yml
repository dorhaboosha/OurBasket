# Runs every check on each push and on Pull Requests into main.
# The repository is public, so GitHub Actions minutes are free.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # The ruleset on main requires this check by name; keep the name stable.
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Same major version as docker-compose.yml and the Neon project.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ourbasket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ourbasket_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Placeholder values only. CI never talks to Google, Pusher or a real database.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ourbasket_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ourbasket_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ourbasket_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Also generates the Prisma client (postinstall).
      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # Integration tests apply the migrations to the Postgres service first.
      - name: Unit and integration tests
        run: npm test

      # The seed must run cleanly on a migrated database, and twice in a row.
      - name: Seed
        run: npm run db:seed && npm run db:seed

      # Builds the app and runs the browser tests against it, in the preinstalled Chrome.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
